# ──────────────────────────────────────────────────────────────────────────
#  Top security venues (CORE rank A / A*) — deadline tracker.
#  Sources: official CFPs + https://sec-deadlines.github.io/   (update each cycle)
#  Submission deadlines are AoE (Anywhere-on-Earth, UTC-12), 23:59.
#  Each deadline round carries its own `notif` (author-notification date).
#  Store the REAL announced dates for the current cycle. The page auto-rolls a
#  venue to next year (shown as TBA/estimated) once its conference date passes —
#  no need to edit then.
#  Flags force a date to render as TBA even though it is in the future
#  (use only for an upcoming cycle whose date is not officially announced yet):
#    tba: true / notif_tba: true / conf_tba: true
# ──────────────────────────────────────────────────────────────────────────
source: "https://sec-deadlines.github.io/"


# Short "about" paragraphs shown on the homepage.
about:
  - >-
    I am **Jaeho Bae (배재호)**, an M.S. student in Computer Science and
    Engineering at **UNIST**. I love reading, learning, and programming.
  - >-
    My research interests center on **software security** — security
    vulnerability detection, bytecode analysis, and the application of
    **generative AI** to software engineering. I previously studied AI and
    Computer Science & Engineering at **Handong Global University**.

# Research interests (chips on the homepage)
interests:
  - Software Security
  - Web Security
  - AI ⇄ Security        # "AI for Security" & "Security for AI", both directions
  - Vulnerability Detection
  - Bytecode Analysis
  - Generative AI for SE
  - Computer Systems


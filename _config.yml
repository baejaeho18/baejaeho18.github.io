# ──────────────────────────────────────────────────────────────────────────
#  Site settings  ·  Jaeho Bae — Academic homepage + Blog
# ──────────────────────────────────────────────────────────────────────────

title:            Jaeho Bae
tagline:          Computer Science · Security · AI
description: >-
  Academic homepage of Jaeho Bae (배재호) — M.S. student in Computer Science
  and Engineering at UNIST. Research in software security, vulnerability
  detection, and AI.
lang:             en
timezone:         Asia/Seoul

# url is optional on GitHub Pages, but used by jekyll-seo-tag / feed.
url:              "https://baejaeho18.github.io"
baseurl:          ""

# ── Author / profile ───────────────────────────────────────────────────────
author:
  name:           Jaeho Bae
  korean_name:    배재호
  email:          bjh1749@gmail.com
  avatar:         /assets/img/me/me0.jpg
  title:          M.S. Student in Computer Science & Engineering
  affiliation:    UNIST
  location:       Ulsan, South Korea
  bio: >-
    I am interested in technology and research for humans — computer systems,
    cybersecurity, and AI.

# Social links (rendered in the sidebar & footer)
social:
  github:    baejaeho18
  email:     bjh1749@gmail.com
  scholar:   ""           # Google Scholar profile URL (optional)
  linkedin:  ""           # LinkedIn URL (optional)
  cv:        "https://github.com/baejaeho18/baejaeho18/blob/main/assets/%5BCV%5D%20CurriculumVitae_BJH.pdf"
  portfolio: "https://guiltless-expert-cc3.notion.site/97b3e994d3504e1287361de5e6a8a478"

# ── Blog ────────────────────────────────────────────────────────────────────
# Default header image for blog hero / posts without their own image.
blog:
  cover: /assets/img/legacy/seattle.png
  description: "기록하며 배우고, 배워서 남주기 위한 공간."

# ── Comments (giscus) ─────────────────────────────────────────────────────────
# Comments stay OFF until these IDs are filled in. Generate them at
# https://giscus.app (requires GitHub Discussions enabled on the repo below).
comments:
  giscus:
    repo:        ""   # e.g. "baejaeho18/baejaeho18.github.io"
    repo_id:     ""
    category:    "Comments"
    category_id: ""

# ── Build / Markdown ─────────────────────────────────────────────────────────
markdown:         kramdown
highlighter:      rouge
kramdown:
  input:          GFM
  math_engine:    mathjax
  syntax_highlighter: rouge

permalink:        /blog/:year/:month/:title/

# Pagination (jekyll-paginate v1 — GitHub Pages compatible)
paginate:         6
paginate_path:    "/blog/page:num/"
excerpt_separator: <!--more-->

sass:
  style:          compressed

# ── Defaults ──────────────────────────────────────────────────────────────
defaults:
  - scope:
      path:       ""
      type:       posts
    values:
      layout:     post
      comments:   true
  - scope:
      path:       ""
      type:       pages
    values:
      layout:     page

# ── Plugins ──────────────────────────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-redirect-from
  - jemoji

feed:
  path: /feed.xml

# ── Files ─────────────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - LICENSE.md
  - .scripts
  - Dockerfile.dev
  - "*.toml"
include:
  - .well-known
